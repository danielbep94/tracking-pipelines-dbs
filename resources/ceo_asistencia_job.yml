resources:
  jobs:
    CEO_ASISTENCIA:
      name: CEO_ASISTENCIA
      description: Monthly CEO Asistencia snapshot ETL with shared run telemetry.
      max_concurrent_runs: 1

      tasks:
        - task_key: CEO_ASISTENCIA
          notebook_task:
            notebook_path: REPLACE_WITH_CURRENT_PRODUCTION_NOTEBOOK_PATH/JOB
            source: WORKSPACE
            base_parameters:
              tracking_job_id: "{{job.id}}"
              tracking_job_run_id: "{{job.run_id}}"
              tracking_task_run_id: "{{task.run_id}}"
              tracking_task_name: "{{task.name}}"
              tracking_attempt_number: "{{task.execution_count}}"
              tracking_trigger_type: "{{job.trigger.type}}"
              tracking_job_started_at_utc: "{{job.start_time.iso_datetime}}"
              tracking_pipeline_version: REPLACE_WITH_DEPLOYED_GIT_COMMIT_SHA
          existing_cluster_id: REPLACE_WITH_CURRENT_CLUSTER_ID

      tags:
        environment: PROD
        owner: Victor_Hernandez
        pipeline: CEO_ASISTENCIA
        project: CEO
        team: DataPowerhouse

      queue:
        enabled: true
