dataset:
  name: pipeline_runs
  description: Shared append-only execution history for all enterprise data pipelines.
  target_table: PRD_MDP.MDP_STG.PIPELINE_RUNS
  reporting_view: PRD_MDP.MDP_STG.VW_PIPELINE_RUNS
  daily_performance_view: PRD_MDP.MDP_STG.VW_PIPELINE_DAILY_PERFORMANCE
  grain: one terminal record per pipeline task attempt
  logical_unique_key: RUN_ID
  physical_primary_key_enforced: false
  load_strategy: append_only
  timestamp_standard: UTC

columns:
  - {name: RUN_ID, type: VARCHAR, nullable: false, description: "UUID generated once for the task attempt; logical unique key."}
  - {name: PIPELINE_NAME, type: VARCHAR, nullable: false, description: "Stable cross-repository pipeline identifier."}
  - {name: PIPELINE_VERSION, type: VARCHAR, nullable: true, description: "Full deployed Git commit SHA, tag or controlled release."}
  - {name: ENVIRONMENT, type: VARCHAR, nullable: false, description: "Runtime environment such as PROD or TEST."}
  - {name: STATUS, type: VARCHAR, nullable: false, description: "Terminal outcome: SUCCEEDED, FAILED or SKIPPED."}
  - {name: DATABRICKS_JOB_ID, type: VARCHAR, nullable: true, description: "Databricks job identifier."}
  - {name: DATABRICKS_JOB_RUN_ID, type: VARCHAR, nullable: true, description: "Databricks job-run identifier."}
  - {name: DATABRICKS_TASK_RUN_ID, type: VARCHAR, nullable: true, description: "Databricks task-run identifier."}
  - {name: DATABRICKS_TASK_NAME, type: VARCHAR, nullable: true, description: "Task key within the Databricks job."}
  - {name: ATTEMPT_NUMBER, type: NUMBER, nullable: true, description: "Task execution count, including retries."}
  - {name: TRIGGER_TYPE, type: VARCHAR, nullable: true, description: "Databricks trigger category."}
  - {name: SOURCE_NAME, type: VARCHAR, nullable: true, description: "Logical source system or ingestion channel."}
  - {name: SOURCE_FILE, type: VARCHAR, nullable: true, description: "Physical source filename for file-based pipelines."}
  - {name: TARGET_NAME, type: VARCHAR, nullable: true, description: "Fully qualified primary target object."}
  - {name: PERIOD_START_DATE, type: DATE, nullable: true, description: "First business date covered by the input."}
  - {name: PERIOD_END_DATE, type: DATE, nullable: true, description: "Last business date covered by the input."}
  - {name: STARTED_AT_UTC, type: TIMESTAMP_TZ, nullable: false, description: "UTC job start used for end-to-end elapsed time."}
  - {name: COMPLETED_AT_UTC, type: TIMESTAMP_TZ, nullable: false, description: "UTC timestamp when the terminal record was built."}
  - {name: DURATION_SECONDS, type: "NUMBER(18,3)", nullable: false, description: "Seconds from start through record completion."}
  - {name: SOURCE_ROWS, type: NUMBER, nullable: true, description: "Business rows read from the source."}
  - {name: STAGING_ROWS, type: NUMBER, nullable: true, description: "Rows persisted to monthly Delta staging."}
  - {name: TRANSFORMED_ROWS, type: NUMBER, nullable: true, description: "Business rows after validation and transformation."}
  - {name: TARGET_ROWS_BEFORE, type: NUMBER, nullable: true, description: "Target rows for the processing scope before loading."}
  - {name: TARGET_ROWS_AFTER, type: NUMBER, nullable: true, description: "Target rows for the processing scope after loading or failure."}
  - {name: TARGET_ROW_DELTA, type: NUMBER, nullable: true, description: "TARGET_ROWS_AFTER minus TARGET_ROWS_BEFORE."}
  - {name: BUSINESS_METRICS_JSON, type: VARCHAR, nullable: true, description: "Pipeline-specific metrics serialized as JSON."}
  - {name: ERROR_TYPE, type: VARCHAR, nullable: true, description: "Exception class for failed attempts."}
  - {name: ERROR_MESSAGE, type: VARCHAR, nullable: true, description: "Sanitized and length-limited failure message."}
  - {name: CREATED_AT_UTC, type: TIMESTAMP_TZ, nullable: false, description: "Explicit UTC insertion timestamp."}

standard_metrics:
  - SOURCE_ROWS
  - STAGING_ROWS
  - TRANSFORMED_ROWS
  - TARGET_ROWS_BEFORE
  - TARGET_ROWS_AFTER
  - TARGET_ROW_DELTA
  - DURATION_SECONDS

pipeline_specific_metrics:
  storage_column: BUSINESS_METRICS_JSON
  ceo_asistencia_keys:
    - before.TARGET_ROWS
    - after.TARGET_ROWS
    - before.NON_NULL_EMPLOYEE_COUNT
    - after.NON_NULL_EMPLOYEE_COUNT
    - before.DISTINCT_EMPLOYEE_COUNT
    - after.DISTINCT_EMPLOYEE_COUNT
    - before.NULL_EMPLOYEE_COUNT
    - after.NULL_EMPLOYEE_COUNT
    - before.DISTINCT_ID_COUNT
    - after.DISTINCT_ID_COUNT
    - before.DISTINCT_AREA_COUNT
    - after.DISTINCT_AREA_COUNT
    - before.VALID_ATTENDANCE_COUNT
    - after.VALID_ATTENDANCE_COUNT
    - source_columns
    - delta_rows_after

statuses:
  SUCCEEDED: Business processing and target validation completed.
  FAILED: Attempt ended with a business-processing error and telemetry was attempted.
  SKIPPED: No business input required processing; the telemetry write is the durable result.

required_job_parameters:
  tracking_job_id: "{{job.id}}"
  tracking_job_run_id: "{{job.run_id}}"
  tracking_task_run_id: "{{task.run_id}}"
  tracking_task_name: "{{task.name}}"
  tracking_attempt_number: "{{task.execution_count}}"
  tracking_trigger_type: "{{job.trigger.type}}"
  tracking_job_started_at_utc: "{{job.start_time.iso_datetime}}"
  tracking_pipeline_version: REPLACE_WITH_DEPLOYED_GIT_COMMIT_SHA

limitations:
  - RUN_ID uniqueness is a logical application contract, not an enforced Snowflake primary key.
  - Abrupt cluster termination can prevent the terminal record from being written.
  - Completed-load telemetry and metric reads are best-effort and do not change the business result.
  - SKIPPED telemetry is strict because it is the only durable outcome of a no-input run.
  - A FAILED row cannot be written when the Snowflake connection itself is unavailable.
  - Compare performance using multiple equivalent runs and medians; separate cold and warm starts.
